Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

Section "ServerLayout"
    Identifier "Steam Headless"
    Screen "AMD screen"
    InputDevice "Bolt keyboard" "CoreKeyboard"
    InputDevice "Unifying mouse" "CorePointer"
    InputDevice "Bolt mouse" "SendCoreEvents"
EndSection

Section "Device"
    Identifier "AMD modesetting"
    Driver "modesetting"
    BusID "PCI:6:0:0"
    Option "AccelMethod" "glamor"
EndSection

Section "Screen"
    Identifier "AMD screen"
    Device "AMD modesetting"
EndSection

Section "InputDevice"
    Identifier "Bolt keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/steam-headless-kbd"
    Option "GrabDevice" "true"
    Option "XkbLayout" "de"
EndSection

Section "InputDevice"
    Identifier "Unifying mouse"
    Driver "evdev"
    Option "Device" "/dev/input/steam-headless-mouse-mxv"
    Option "GrabDevice" "true"
EndSection

Section "InputDevice"
    Identifier "Bolt mouse"
    Driver "evdev"
    Option "Device" "/dev/input/steam-headless-mouse-rcv"
    Option "GrabDevice" "true"
EndSection
