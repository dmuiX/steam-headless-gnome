name: Scan published image
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pull current published image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker pull "$image"
          docker tag "$image" steam-headless-gnome:published-scan
          docker image inspect --format '{{json .RepoDigests}}' "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan with the current advisory database
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steam-headless-gnome:published-scan
          scanners: vuln
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
