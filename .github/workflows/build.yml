name: Build container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          docker build --tag steam-headless-gnome:test .
          bash .github/test-session.sh steam-headless-gnome:test

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Debian package indexes
        id: debian
        shell: bash
        run: |
          fingerprint=$(bash .github/debian-index-key.sh)
          [[ $fingerprint =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/debian-build-marker"
          printf '%s\n' "$fingerprint" > "$RUNNER_TEMP/debian-build-marker/fingerprint"
          printf 'key=debian-index-v1-%s-%s\nfingerprint=%s\n' "$GITHUB_SHA" "$fingerprint" "$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Look up the last successful build for these indexes
        if: github.event_name == 'schedule'
        id: built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/debian-build-marker
          key: ${{ steps.debian.outputs.key }}
          lookup-only: true
      - name: Set up Docker Buildx
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load the release image
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: steam-headless-gnome:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: APT_INDEX_KEY=${{ steps.debian.outputs.fingerprint }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max,ignore-error=true
      - name: Test the release image
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        run: bash .github/test-session.sh steam-headless-gnome:test
      - name: Scan for fixable high and critical vulnerabilities
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steam-headless-gnome:test
          scanners: vuln
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Generate CycloneDX SBOM
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: steam-headless-gnome:test
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - name: Upload SBOM
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
      - name: Log in to GHCR
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'schedule' || steps.built.outputs.cache-hit != 'true'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag steam-headless-gnome:test "$image:$version"
          docker tag steam-headless-gnome:test "$image:latest"
          docker push "$image:$version"
          docker push "$image:latest"
          printf 'Published `%s` and `%s`.\n' "$image:$version" "$image:latest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remember the successful scheduled build
        if: github.event_name == 'schedule' && steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/debian-build-marker
          key: ${{ steps.debian.outputs.key }}
